name: CI

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check for errors
        run: npm run lint

  typecheck:
    name: Typecheck (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck

  build:
    name: Build (Rollup)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build bundle
        run: npm run build
      # dist/ is the artifact HACS serves, so an empty or missing bundle has to
      # fail here rather than at a user's dashboard.
      - name: Verify bundle
        run: test -s dist/valetudo-map-card.js
      - name: Upload bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: valetudo-map-card
          path: dist/valetudo-map-card.js
          if-no-files-found: error
          retention-days: 14
